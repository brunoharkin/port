<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ugarit Digital - Automação Inteligente e IA sob medida</title>
    <link rel="icon" href="/frontend/assets/logos/UgaritLogo.svg" type="image/svg+xml">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#00f0ff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Ugarit Digital">
    <!-- Schema.org será gerenciado pelo React Helmet -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/frontend/main.jsx"></script>
    <script>
      // Redirecionamento se não estiver no domínio oficial
      (function() {
        var dominioOficial = 'portfolio.ugaritdigital.com';
        var host = window.location.hostname;
        // Permite: domínio oficial, www, subdomínios, localhost, IPs locais e redes internas
        var isOficial = host === dominioOficial ||
                        host === 'www.' + dominioOficial ||
                        host.endsWith('.' + dominioOficial) ||
                        host === 'localhost' ||
                        /^\d+\.\d+\.\d+\.\d+$/.test(host) || // IPs locais
                        host.endsWith('.local') ||
                        host.endsWith('.lan');
        if (!isOficial) {
          window.location.href = 'https://' + dominioOficial;
        }
      })();
    </script>
  </body>
</html>
