    <meta name="theme-color" content="#00f0ff">

  <body>
    <div id="root"></div>
    <script type="module" src="/frontend/main.jsx"></script>
    <script>
      // Redirecionamento se não estiver no domínio oficial
      (function() {
        var dominioOficial = 'portfolio.ugaritdigital.com'; // Substitua pelo seu domínio real
        if (window.location.hostname !== dominioOficial && window.location.hostname !== 'www.' + dominioOficial && !window.location.hostname.includes('localhost')) {
          window.location.href = 'https://' + dominioOficial;
        }
      })();
    </script>
  </body>
